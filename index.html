<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Online Harassment of Women — Constitutional &amp; Legal Remedies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --ink:#12151c;
  --ink-2:#1b202b;
  --ink-3:#242b39;
  --paper:#f6f1e6;
  --paper-2:#efe8d8;
  --brass:#c79a54;
  --brass-soft:#e2c184;
  --burgundy:#8a2f3f;
  --burgundy-soft:#b5495c;
  --text-hi:#f2ede0;
  --text-mid:#b9bfce;
  --text-low:#7c8496;
  --ink-text:#20242f;
  --ink-text-soft:#565f74;
  --rule:rgba(242,237,224,0.14);
  --shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:var(--ink);
  color:var(--text-hi);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color: transparent;
}
::selection{background:var(--brass);color:var(--ink);}

/* subtle paper-grain / vignette backdrop */
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(199,154,84,0.08), transparent 60%),
    radial-gradient(ellipse 100% 60% at 50% 110%, rgba(138,47,63,0.10), transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* ================= DECK / SLIDES ================= */
#deck{
  position:relative;
  width:100vw;height:100vh;
  height:100dvh;
}
.slide{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding: clamp(20px,4vw,64px);
  opacity:0;
  visibility:hidden;
  transform:translateX(40px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1);
  z-index:1;
}
.slide.active{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
  z-index:2;
}
.slide.prev{
  transform:translateX(-40px);
}

/* ---- Title slide ---- */
.slide-title{
  text-align:center;
}
.docket-tag{
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.28em;
  text-transform:uppercase;
  font-size:clamp(10px,1.1vw,13px);
  color:var(--brass-soft);
  border:1px solid rgba(199,154,84,0.4);
  border-radius:999px;
  padding:7px 18px;
  display:inline-block;
  margin-bottom:clamp(20px,3vw,34px);
}
.title-mark{
  width:clamp(46px,5vw,60px);
  height:1px;
  background:linear-gradient(90deg,transparent,var(--brass),transparent);
  margin:0 auto clamp(22px,3vw,32px);
}
h1.main-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:clamp(28px,4.6vw,64px);
  line-height:1.08;
  letter-spacing:-0.01em;
  max-width:16ch;
  margin:0 auto;
  color:var(--text-hi);
}
.subtitle-line{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(15px,1.7vw,22px);
  color:var(--brass-soft);
  margin-top:clamp(16px,2vw,22px);
}
.author-block{
  margin-top:clamp(36px,5vw,56px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.author-name{
  font-family:'IBM Plex Sans',sans-serif;
  font-weight:600;
  font-size:clamp(14px,1.5vw,18px);
  letter-spacing:.04em;
  color:var(--text-hi);
}
.author-role{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(10px,1vw,12px);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text-low);
}
.sample-strip{
  margin-top:clamp(30px,4vw,46px);
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(10px,1vw,12px);
  color:var(--text-low);
  letter-spacing:.08em;
  display:flex;
  gap:clamp(14px,2vw,28px);
  flex-wrap:wrap;
  justify-content:center;
}
.sample-strip span b{color:var(--brass-soft);font-weight:600;}

/* ---- Objective slide ---- */
.slide-objective{
  align-items:stretch;
  justify-content:center;
}
.obj-wrap{
  width:min(880px,92vw);
  margin:0 auto;
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.26em;
  text-transform:uppercase;
  font-size:clamp(10px,1vw,12px);
  color:var(--brass-soft);
  margin-bottom:10px;
  display:block;
}
h2.section-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:clamp(26px,3.6vw,46px);
  margin:0 0 clamp(22px,3vw,36px) 0;
  color:var(--text-hi);
  line-height:1.15;
}
.obj-list{
  list-style:none;
  margin:0;padding:0;
  display:flex;
  flex-direction:column;
}
.obj-list li{
  display:flex;
  gap:clamp(14px,2vw,24px);
  align-items:flex-start;
  padding:clamp(14px,2vw,22px) 0;
  border-bottom:1px solid var(--rule);
  font-size:clamp(14px,1.5vw,19px);
  line-height:1.5;
  color:var(--text-mid);
}
.obj-list li:first-child{border-top:1px solid var(--rule);}
.obj-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(12px,1.3vw,15px);
  color:var(--brass);
  flex:0 0 auto;
  padding-top:2px;
}

/* ---- Analysis / Exhibit slides ---- */
.slide-exhibit{
  padding: clamp(16px,3vw,48px) clamp(16px,4vw,72px);
}
.exhibit-frame{
  width:100%;
  max-width:1280px;
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:clamp(10px,1.6vh,18px);
}
.exhibit-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.exhibit-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(11px,1.1vw,13px);
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  background:var(--brass-soft);
  padding:6px 14px 6px 14px;
  border-radius:3px 3px 3px 3px;
  position:relative;
  font-weight:600;
}
.exhibit-dim{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(10px,1vw,12px);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-low);
  border:1px solid var(--rule);
  padding:5px 12px;
  border-radius:999px;
}
.exhibit-body{
  display:grid;
  grid-template-columns: 1.55fr 1fr;
  gap:clamp(16px,2.4vw,36px);
  min-height:0;
  align-items:center;
}
.chart-card{
  background:var(--paper);
  border-radius:10px;
  box-shadow:var(--shadow);
  height:100%;
  max-height:68vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(10px,1.4vw,18px);
  position:relative;
  overflow:hidden;
}
.chart-card::after{
  content:"";
  position:absolute; inset:0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  border-radius:10px;
  pointer-events:none;
}
.chart-card img{
  max-width:100%;
  max-height:100%;
  width:auto;height:auto;
  object-fit:contain;
  display:block;
}
.legend-panel{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:clamp(10px,1.6vh,16px);
  min-width:0;
}
.legend-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(10px,1vw,12px);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--burgundy-soft);
}
.legend-q{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(16px,2vw,25px);
  line-height:1.35;
  color:var(--text-hi);
  border-left:2px solid var(--brass);
  padding-left:clamp(14px,1.6vw,20px);
}
.legend-caption{
  font-size:clamp(12px,1.2vw,15px);
  line-height:1.6;
  color:var(--text-mid);
  max-width:46ch;
}
.exhibit-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(9px,.95vw,11px);
  color:var(--text-low);
  letter-spacing:.08em;
}

/* ================= NAVIGATION ================= */
.nav-btn{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  width:clamp(48px,6vw,64px);
  height:clamp(48px,6vw,64px);
  border-radius:50%;
  background:rgba(36,43,57,0.7);
  border:1px solid rgba(242,237,224,0.16);
  backdrop-filter:blur(6px);
  color:var(--text-hi);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:20;
  transition:background .2s ease, border-color .2s ease, opacity .2s ease, transform .15s ease;
  touch-action:manipulation;
}
.nav-btn:hover{background:rgba(199,154,84,0.22);border-color:var(--brass);}
.nav-btn:active{transform:translateY(-50%) scale(.93);}
.nav-btn svg{width:44%;height:44%;}
.nav-prev{left:clamp(10px,2vw,28px);}
.nav-next{right:clamp(10px,2vw,28px);}
.nav-btn.disabled{opacity:0;pointer-events:none;}

.hud{
  position:fixed;
  left:0;right:0;bottom:0;
  padding:14px clamp(16px,3vw,36px) clamp(14px,2vh,20px);
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:20;
  pointer-events:none;
}
.hud-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(9px,1vw,11px);
  letter-spacing:.1em;
  color:var(--text-low);
}
.hud-count b{color:var(--brass-soft);font-weight:600;}
.progress-track{
  width:100%;
  height:3px;
  background:rgba(242,237,224,0.12);
  border-radius:2px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--brass),var(--burgundy-soft));
  border-radius:2px;
  transition:width .45s cubic-bezier(.22,.61,.36,1);
}

.help-hint{
  position:fixed;
  top:clamp(14px,2vw,26px);
  right:clamp(14px,3vw,32px);
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.1em;
  color:var(--text-low);
  z-index:20;
  display:flex;
  gap:6px;
  align-items:center;
  opacity:.85;
}
.kbd{
  border:1px solid var(--rule);
  border-radius:4px;
  padding:1px 6px;
  font-size:10px;
}

/* click zones for tap navigation (mobile/smartboard, avoid center content) */
.tap-zone{
  position:fixed;
  top:0;bottom:0;
  width:14%;
  z-index:15;
  cursor:pointer;
}
.tap-zone.left{left:0;}
.tap-zone.right{right:0;}

@media (max-width: 720px){
  .exhibit-body{grid-template-columns:1fr;grid-template-rows:auto auto;}
  .chart-card{max-height:42vh;}
  .legend-panel{gap:8px;}
  .legend-q{font-size:15px;padding-left:12px;}
  .legend-caption{display:none;}
  .nav-btn{
    width:44px;height:44px;
    top:auto;
    bottom:64px;
    transform:none;
  }
  .nav-btn:active{transform:scale(.93);}
  .nav-prev{left:10px;}
  .nav-next{right:10px;}
  .help-hint{display:none;}
  .sample-strip{display:none;}
  .tap-zone{width:20%;top:80px;bottom:110px;}
  .slide{padding:16px;padding-bottom:96px;}
  .exhibit-foot span:first-child{display:none;}
  .exhibit-foot{justify-content:center;}
  .hud{padding:10px 16px 12px;}
}
@media (max-height: 480px) and (orientation: landscape){
  .chart-card{max-height:60vh;}
  .exhibit-body{grid-template-columns:1.4fr 1fr;}
}

@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .2s linear;transform:none !important;}
}
</style>
</head>
<body>

<div id="deck"></div>

<div class="tap-zone left" id="tapLeft" aria-hidden="true"></div>
<div class="tap-zone right" id="tapRight" aria-hidden="true"></div>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button class="nav-btn nav-next" id="btnNext" aria-label="Next slide">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</button>

  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<script>
const FIGURES = JSON.parse(document.getElementById('figure-data').textContent);
const AUTHOR = "Hrithika Suri";
const TITLE = "A Study on Online Harassment of Women";
const SUBTITLE = "Constitutional and Legal Remedies";

// ---------- Build slide list ----------
const slides = [];

// Slide 1: Title
slides.push({ type:'title', hud:'Title' });

// Slide 2: Objective
slides.push({ type:'objective', hud:'Objective of the Study',
  items:[
    "To assess the adequacy of current statutory provisions addressing online harassment of women.",
    "To examine the procedural effectiveness of civil and constitutional remedies available to victims.",
    "To identify systemic barriers that impede victims\u2019 access to justice in digital contexts.",
    "To formulate policy recommendations that align domestic law with international human-rights standards."
  ]
});

// Slides 3+: Exhibits (Analysis / graphs with legend) — curated selection
FIGURES.forEach((fig,i)=>{
  slides.push({
    type:'exhibit',
    hud:`Exhibit ${String(fig.num).padStart(2,'0')} \u2014 ${fig.dim}-wise Response`,
    num: fig.num,
    dim: fig.dim,
    q: fig.q,
    img: fig.img,
    selIdx: i+1,
    selTotal: FIGURES.length
  });
});

const deck = document.getElementById('deck');
let current = 0;

function renderSlide(s, idx){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = idx;

  if(s.type === 'title'){
    el.classList.add('slide-title');
    el.innerHTML = `
      <div class="docket-tag">Empirical Study &middot; n = 213</div>
      <div class="title-mark"></div>
      <h1 class="main-title">${TITLE}</h1>
      <div class="subtitle-line">${SUBTITLE}</div>
      <div class="author-block">
        <div class="author-name">${AUTHOR}</div>
        <div class="author-role">Author</div>
      </div>
      <div class="sample-strip">
        <span><b>68%</b> repeat harassment reported</span>
        <span><b>55%</b> unaware of protective statutes</span>
        <span><b>6</b> key findings featured</span>
      </div>
    `;
  }

  if(s.type === 'objective'){
    el.classList.add('slide-objective');
    const items = s.items.map((t,i)=>`
      <li><span class="obj-num">0${i+1}</span><span>${t}</span></li>
    `).join('');
    el.innerHTML = `
      <div class="obj-wrap">
        <span class="eyebrow">Slide 02</span>
        <h2 class="section-title">Objective of the Study</h2>
        <ul class="obj-list">${items}</ul>
      </div>
    `;
  }

  if(s.type === 'exhibit'){
    el.classList.add('slide-exhibit');
    el.innerHTML = `
      <div class="exhibit-frame">
        <div class="exhibit-head">
          <span class="exhibit-tag">Exhibit ${String(s.num).padStart(2,'0')}</span>
          <span class="exhibit-dim">${s.dim}-wise Distribution</span>
        </div>
        <div class="exhibit-body">
          <div class="chart-card">
            <img src="data:image/png;base64,${s.img}" alt="Figure ${s.num}: ${s.dim}-wise distribution of respondent answers" loading="lazy">
          </div>
          <div class="legend-panel">
            <span class="legend-label">Legend</span>
            <p class="legend-q">&ldquo;${s.q}&rdquo;</p>
            <p class="legend-caption">Distribution of respondent answers to the statement above, broken down by ${s.dim.toLowerCase()}, from a sample of 213 respondents.</p>
          </div>
        </div>
        <div class="exhibit-foot">
          <span>Data Analysis &amp; Interpretation</span>
          <span>Figure ${s.num} of 25 &middot; Selected Finding ${s.selIdx} of ${s.selTotal}</span>
        </div>
      </div>
    `;
  }

  return el;
}

// Render all slides up front (fast, no flash on nav)
slides.forEach((s,i)=>{
  const el = renderSlide(s,i);
  deck.appendChild(el);
});

const slideEls = Array.from(deck.children);
const hudTitle = document.getElementById('hudTitle');
const hudCurrent = document.getElementById('hudCurrent');
const hudTotal = document.getElementById('hudTotal');
const progressFill = document.getElementById('progressFill');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

hudTotal.textContent = slides.length;

function goTo(idx){
  if(idx < 0 || idx >= slides.length) return;
  const dir = idx > current ? 1 : -1;
  slideEls[current].classList.remove('active');
  slideEls[current].classList.toggle('prev', dir>0);
  current = idx;
  slideEls[current].classList.remove('prev');
  slideEls[current].classList.add('active');

  hudTitle.textContent = slides[current].hud;
  hudCurrent.textContent = current+1;
  progressFill.style.width = ((current)/(slides.length-1))*100 + '%';

  btnPrev.classList.toggle('disabled', current===0);
  btnNext.classList.toggle('disabled', current===slides.length-1);

  history.replaceState(null,'', '#s' + (current+1));
}

// init
slideEls[0].classList.add('active');
hudTitle.textContent = slides[0].hud;
progressFill.style.width = '0%';
btnPrev.classList.add('disabled');

btnPrev.addEventListener('click', ()=>goTo(current-1));
btnNext.addEventListener('click', ()=>goTo(current+1));
document.getElementById('tapLeft').addEventListener('click', ()=>goTo(current-1));
document.getElementById('tapRight').addEventListener('click', ()=>goTo(current+1));

window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1); }
  if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1); }
  if(e.key === 'Home'){ goTo(0); }
  if(e.key === 'End'){ goTo(slides.length-1); }
});

// touch swipe
let touchStartX = null, touchStartY = null;
deck.addEventListener('touchstart', (e)=>{
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, {passive:true});
deck.addEventListener('touchend', (e)=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(dx < 0) goTo(current+1); else goTo(current-1);
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

// deep link support
if(location.hash && /^#s\d+$/.test(location.hash)){
  const n = parseInt(location.hash.slice(2),10) - 1;
  if(n>=0 && n<slides.length){
    slideEls[0].classList.remove('active');
    goTo(n);
  }
}
</script>
</body>
</html>
