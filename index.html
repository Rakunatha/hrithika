<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Influencer Liability for Misleading Advertisements — A Tort Law Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#12213A;
    --ink-2:#0D1A2E;
    --paper:#F5F6F3;
    --paper-2:#ECEEEA;
    --brass:#A9823D;
    --brass-soft:#D9C48F;
    --wine:#6E2532;
    --slate:#5B6472;
    --line: rgba(18,33,58,0.12);
    --line-dark: rgba(245,246,243,0.16);
    --shadow: 0 20px 50px -20px rgba(18,33,58,0.35);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--ink-2);
    font-family:'Inter', system-ui, sans-serif;
    color: var(--ink);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection{ background: var(--brass-soft); color: var(--ink); }

  h1,h2,h3, .display{
    font-family:'Fraunces', Georgia, serif;
    font-weight:500;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #app{ position:relative; width:100vw; height:100vh; height:100dvh; }

  /* ===== Slide deck ===== */
  #deck{
    position:absolute; inset:0;
  }
  .slide{
    position:absolute; inset:0;
    display:flex;
    flex-direction:column;
    background: var(--paper);
    opacity:0;
    visibility:hidden;
    transform: translateX(24px);
    transition: opacity .45s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1), visibility 0s linear .45s;
    padding: clamp(28px, 5vw, 76px) clamp(28px, 6vw, 96px);
    padding-bottom: 108px;
  }
  .slide.dark{ background: var(--ink); color: var(--paper); }
  .slide.active{
    opacity:1; visibility:visible; transform: translateX(0);
    transition: opacity .45s cubic-bezier(.22,.61,.36,1), transform .45s cubic-bezier(.22,.61,.36,1), visibility 0s;
    z-index: 2;
  }
  .slide.prev{ transform: translateX(-24px); }

  .slide-inner{
    max-width: 1180px;
    margin: 0 auto;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .eyebrow{
    font-size: 11.5px;
    color: var(--brass);
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 18px;
    flex-shrink:0;
  }
  .slide.dark .eyebrow{ color: var(--brass-soft); }
  .eyebrow .tick{ width: 22px; height:1px; background: var(--brass); display:inline-block; }
  .slide.dark .eyebrow .tick{ background: var(--brass-soft); }

  .slide h2.title{
    font-size: clamp(26px, 3.6vw, 44px);
    line-height:1.08;
    color: var(--ink);
    max-width: 16ch;
  }
  .slide.dark h2.title{ color: var(--paper); }

  .body-copy{
    font-size: clamp(14.5px, 1.15vw, 17px);
    line-height:1.62;
    color: #2b3549;
    max-width: 62ch;
  }
  .slide.dark .body-copy{ color: rgba(245,246,243,0.82); }

  ul.points{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  ul.points li{
    display:flex; gap:14px; align-items:flex-start;
    font-size: clamp(14px, 1.05vw, 16.5px);
    line-height:1.55;
    color:#2b3549;
    max-width: 60ch;
  }
  .slide.dark ul.points li{ color: rgba(245,246,243,0.85); }
  ul.points li::before{
    content:"";
    flex:none;
    width:6px; height:6px;
    margin-top:8px;
    background: var(--brass);
    border-radius: 50%;
  }

  .scroll-area{
    overflow-y:auto;
    min-height:0;
    padding-right: 6px;
  }
  .scroll-area::-webkit-scrollbar{ width:5px; }
  .scroll-area::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }

  /* ===== Title Slide ===== */
  .slide-title{
    justify-content:center;
    align-items:flex-start;
    background:
      radial-gradient(circle at 85% 12%, rgba(169,130,61,0.16), transparent 45%),
      var(--ink);
    color: var(--paper);
  }
  .slide-title .kicker{
    font-size: 12px; color: var(--brass-soft); margin-bottom: 28px;
  }
  .slide-title h1{
    font-size: clamp(34px, 5.6vw, 68px);
    line-height:1.04;
    color:var(--paper);
    max-width: 15ch;
  }
  .slide-title .subtitle{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight:500;
    color: var(--brass-soft);
    font-size: clamp(17px, 1.8vw, 24px);
    margin-top:14px;
  }
  .title-meta{
    margin-top: 56px;
    display:flex;
    flex-wrap:wrap;
    gap: 40px 64px;
    border-top: 1px solid var(--line-dark);
    padding-top: 26px;
    width:100%;
    max-width: 720px;
  }
  .title-meta .field .label{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--brass-soft); margin-bottom:6px;
  }
  .title-meta .field .value{
    font-family:'Fraunces', serif; font-size: 18px; color: var(--paper);
  }

  /* ===== Stat grid ===== */
  .stat-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 8px;
  }
  @media (min-width: 720px){ .stat-grid{ grid-template-columns: repeat(4, 1fr); } }
  .stat-card{
    border: 1px solid var(--line);
    padding: 22px 20px;
    background: rgba(255,255,255,0.5);
  }
  .stat-card .num{
    font-family:'Fraunces', serif;
    font-size: clamp(28px, 3vw, 40px);
    color: var(--wine);
    line-height:1;
  }
  .stat-card .cap{
    margin-top:10px;
    font-size: 12.5px;
    color: var(--slate);
    line-height:1.4;
  }
  .note-box{
    margin-top: 22px;
    border-left: 2px solid var(--brass);
    padding: 4px 0 4px 18px;
    font-size: 13.5px;
    color: var(--slate);
    max-width: 68ch;
    line-height:1.55;
  }

  /* ===== Chart slides ===== */
  .chart-layout{
    display:grid;
    grid-template-columns: 1fr;
    gap: 28px;
    flex:1;
    min-height:0;
  }
  @media (min-width: 860px){
    .chart-layout{ grid-template-columns: 1.15fr 0.85fr; align-items:center; }
  }
  .chart-frame{
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.6);
    padding: 20px;
    height: min(340px, 42vh);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .chart-frame canvas{ max-height:100%; }
  .chart-text .exhibit-tag{
    font-size:11px; color: var(--brass); margin-bottom: 10px;
  }
  .chart-text h3{
    font-size: clamp(16px, 1.6vw, 20px);
    color: var(--ink);
    margin-bottom: 14px;
    line-height:1.35;
  }
  .chart-text .col-label{
    font-size: 10.5px; letter-spacing:.12em; color: var(--brass); margin: 16px 0 8px;
  }

  /* ===== References ===== */
  .ref-list{ display:flex; flex-direction:column; gap:12px; }
  .ref-item{
    display:flex; gap:16px;
    font-size: 13px; line-height:1.5; color:#2b3549;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
  }
  .ref-item .n{ font-family:'IBM Plex Mono', monospace; color: var(--brass); flex:none; width: 24px; }

  /* ===== Progress / eyebrow index ===== */
  .idx{ font-family:'IBM Plex Mono', monospace; }

  /* ===== Controls ===== */
  #controls{
    position:absolute; left:0; right:0; bottom:0;
    height: 76px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    background: linear-gradient(0deg, rgba(13,26,46,0.96), rgba(13,26,46,0.0));
    z-index: 10;
    pointer-events:none;
  }
  #controls > *{ pointer-events:auto; }
  .ctrl-btn{
    width: 46px; height:46px;
    border-radius:50%;
    border: 1px solid rgba(245,246,243,0.28);
    background: rgba(18,33,58,0.55);
    color: #F5F6F3;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background .2s, border-color .2s, transform .15s;
    flex:none;
  }
  .ctrl-btn:hover{ background: var(--brass); border-color: var(--brass); }
  .ctrl-btn:active{ transform: scale(0.94); }
  .ctrl-btn:disabled{ opacity:.3; cursor:default; pointer-events:none; }
  .ctrl-btn svg{ width:18px; height:18px; }

  .ctrl-center{
    display:flex; align-items:center; gap:18px;
    color: #F5F6F3;
  }
  .slide-count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .06em;
    min-width: 62px;
    text-align:center;
  }
  .progress-track{
    width: clamp(90px, 24vw, 320px);
    height: 2px;
    background: rgba(245,246,243,0.22);
    position:relative;
  }
  .progress-fill{
    position:absolute; left:0; top:0; height:100%;
    background: var(--brass);
    transition: width .35s ease;
  }

  .side-actions{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    height:40px; padding:0 16px;
    border-radius: 100px;
    border:1px solid rgba(245,246,243,0.28);
    background: rgba(18,33,58,0.55);
    color:#F5F6F3;
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    transition: background .2s, border-color .2s;
    white-space:nowrap;
  }
  .icon-btn:hover{ background: var(--brass); border-color: var(--brass); }
  .icon-btn svg{ width:14px; height:14px; flex:none; }

  /* ===== Exhibit tab rail (desktop) ===== */
  #rail{
    position:absolute; right: 18px; top:50%; transform: translateY(-50%);
    display:flex; flex-direction:column; gap:7px;
    z-index: 9;
  }
  .rail-tab{
    width: 30px; height: 8px;
    background: rgba(18,33,58,0.18);
    cursor:pointer;
    transition: background .2s, width .2s;
    border-radius:1px;
  }
  .rail-tab.on{ background: var(--brass); width: 40px; }
  @media (max-width: 860px){ #rail{ display:none; } }

  /* keyboard focus */
  .ctrl-btn:focus-visible, .icon-btn:focus-visible, .rail-tab:focus-visible{
    outline: 2px solid var(--brass); outline-offset: 2px;
  }

  @media (max-width: 640px){
    .icon-btn span.full{ display:none; }
    .icon-btn{ padding:0 12px; }
    #controls{ height: 70px; }
    .progress-track{ display:none; }
    .slide{ padding-bottom: 96px; }
  }

  .fs-hide{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="deck"></div>
  <div id="rail"></div>

  <div id="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <div class="ctrl-center">
      <span class="slide-count"><span id="curNum">1</span> / <span id="totalNum">16</span></span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="side-actions">
      <button class="icon-btn" id="fsBtn" aria-label="Toggle full-screen presentation mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
        <span class="full">Present</span>
      </button>
      <button class="icon-btn" id="pptxBtn" aria-label="Download PowerPoint version">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        <span class="full">Download PPTX</span>
      </button>
    </div>

    <button class="ctrl-btn" id="nextBtn" aria-label="Next slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
/* ============================================================
   CONTENT — grounded strictly in the uploaded research paper
   "An Study Influencer Liability for Misleading Advertisements:
   A Tort Law Analysis" — Author: Hrithika Suri
   ============================================================ */

const PALETTE = { ink:'#12213A', brass:'#A9823D', wine:'#6E2532', slate:'#5B6472', line:'rgba(18,33,58,0.14)', paper:'#F5F6F3' };

function chartDefaults(){
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.color = PALETTE.slate;
}

const slides = [];

/* ---------- 1. Title ---------- */
slides.push({
  key:'title', dark:true,
  render:()=>`
    <div class="slide-inner">
      <div class="kicker mono">Empirical Study &nbsp;·&nbsp; Tort Law &nbsp;·&nbsp; Consumer Protection</div>
      <h1>Influencer Liability for<br>Misleading Advertisements</h1>
      <div class="subtitle">A Tort Law Analysis</div>
      <div class="title-meta">
        <div class="field"><div class="label">Author</div><div class="value">Hrithika Suri</div></div>
        <div class="field"><div class="label">Sample</div><div class="value">220 Respondents</div></div>
        <div class="field"><div class="label">Method</div><div class="value">Structured Survey · SPSS 21</div></div>
        <div class="field"><div class="label">Jurisdictions Compared</div><div class="value">India · United States · European Union</div></div>
      </div>
    </div>`
});

/* ---------- 2. Introduction / Background ---------- */
slides.push({
  key:'intro',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 01 — Introduction</span></div>
      <h2 class="title">Background</h2>
      <div class="scroll-area" style="margin-top:22px;">
        <p class="body-copy">Influencer marketing has grown from informal endorsement into a sophisticated commercial strategy that shapes consumer perception at scale. As individual content creators reach wider audiences, legal scholars and policymakers are re-examining whether existing consumer-protection regimes are equipped to address deceptive digital endorsement.</p>
        <ul class="points" style="margin-top:22px;">
          <li>India anchors its framework in the Consumer Protection Act, 2019 alongside the Advertising Standards Council of India.</li>
          <li>The United States regulates deceptive practices through the Federal Trade Commission Act.</li>
          <li>The European Union codifies transparency standards via the Unfair Commercial Practices Directive and the Digital Services Act.</li>
        </ul>
        <p class="body-copy" style="margin-top:20px;">Together, these frameworks signal a growing recognition that influencer content may constitute a distinct category of commercial communication requiring tailored regulatory scrutiny.</p>
      </div>
    </div>`
});

/* ---------- 3. Research Problem / Motivation ---------- */
slides.push({
  key:'problem',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 02 — Research Problem</span></div>
      <h2 class="title">Motivation &amp; the Enforcement Gap</h2>
      <div class="scroll-area" style="margin-top:22px;">
        <p class="body-copy">Enforcement of deceptive-advertising statutes blends judicial review with regulatory audit — a process that is often outpaced by the platforms it governs.</p>
        <ul class="points" style="margin-top:20px;">
          <li>In India, Section 19 of the Consumer Protection Act empowers the Consumer Disputes Redressal Commission to investigate deceptive advertising.</li>
          <li>In the United States, Section 5 of the FTC Act authorises cease-and-desist orders and civil penalties.</li>
          <li>India's 2022 Consumer Protection (E-Commerce) Rules introduced mandatory disclosure requirements for digital advertisements.</li>
          <li>Investigators face a tension between the technical expertise needed to decode algorithmic amplification and the legal standards of proof and causation.</li>
        </ul>
        <p class="body-copy" style="margin-top:20px;">Courts are increasingly asked whether a mere failure to disclose sponsorship constitutes negligence — or a breach of statutory duty. This ambiguity is the central problem the study investigates.</p>
      </div>
    </div>`
});

/* ---------- 4. Objectives ---------- */
slides.push({
  key:'objectives',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 03 — Research Objectives</span></div>
      <h2 class="title">What the Study Sets Out to Do</h2>
      <div class="scroll-area" style="margin-top:26px;">
        <ul class="points" style="gap:20px;">
          <li>Evaluate the potential of technology in preventing and addressing influencer liability for misleading advertisements.</li>
          <li>Identify vulnerabilities and challenges in existing frameworks that govern influencer liability.</li>
          <li>Assess the impact of awareness campaigns and digital platforms in educating the public on this issue.</li>
          <li>Recommend evidence-based policy interventions and best practices for addressing the problem effectively.</li>
        </ul>
      </div>
    </div>`
});

/* ---------- 5. Literature Review ---------- */
slides.push({
  key:'litreview',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 04 — Literature Review</span></div>
      <h2 class="title">Grounding in Prior Scholarship</h2>
      <div class="scroll-area" style="margin-top:20px;">
        <p class="body-copy">The study situates itself within twenty prior works spanning influencer credibility, endorsement effectiveness, product–influencer congruence, and the rise of AI-generated content — most published between 2019 and 2024.</p>
        <div class="col-label" style="margin-top:22px;">Most-cited foundational works referenced</div>
        <ul class="points">
          <li>Chen Lou &amp; Shupei Yuan (2019) — <em>Influencer Marketing: Message Value and Credibility</em>, Journal of Interactive Advertising — cited 2,495 times.</li>
          <li>A. Schouten et al. (2019) — <em>Celebrity vs. Influencer Endorsements</em> — cited 1,392 times.</li>
          <li>C. Ki et al. (2020) — <em>Social Media Influencers as Human Brands</em>, Journal of Retailing and Consumer Services — cited 629 times.</li>
          <li>D. Belanche et al. (2021) — <em>Understanding Influencer Marketing: Congruence</em> — cited 604 times.</li>
        </ul>
        <p class="body-copy" style="margin-top:18px;">Collectively, this body of work establishes the commercial significance of influencer marketing that motivates the present tort-law inquiry.</p>
      </div>
    </div>`
});

/* ---------- 6. Methodology ---------- */
slides.push({
  key:'methodology',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 05 — Methodology</span></div>
      <h2 class="title">Research Design</h2>
      <div class="chart-layout" style="margin-top:8px;">
        <div class="scroll-area">
          <ul class="points">
            <li>Empirical, descriptive research design aligned with mapping perceptions and knowledge of influencer liability.</li>
            <li>220 respondents recruited via convenience sampling of internet users who had encountered branded social content.</li>
            <li>Structured questionnaire using a five-point Likert scale, from Strongly Agree to Strongly Disagree.</li>
            <li>Secondary sources — peer-reviewed journals, government reports, statistical databases — used to triangulate findings.</li>
            <li>Independent variables: age, gender, educational qualification, geographic area, occupation. Dependent variable: composite Likert awareness score.</li>
          </ul>
        </div>
        <div>
          <div class="col-label">Statistical tools · SPSS v21</div>
          <div class="stat-grid" style="grid-template-columns:1fr;">
            <div class="stat-card"><div class="num" style="font-size:20px;">Chi-Square</div><div class="cap">Tests categorical association between demographics and awareness/attitude.</div></div>
            <div class="stat-card"><div class="num" style="font-size:20px;">ANOVA</div><div class="cap">Compares mean awareness scores across demographic groups.</div></div>
            <div class="stat-card"><div class="num" style="font-size:20px;">Pearson r</div><div class="cap">Assesses linear relationships between study variables.</div></div>
          </div>
        </div>
      </div>
    </div>`
});

/* ---------- 7. Sample / Data Context ---------- */
slides.push({
  key:'sample',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 06 — Sample &amp; Data Context</span></div>
      <h2 class="title">Who Was Surveyed</h2>
      <div class="stat-grid" style="margin-top:24px;">
        <div class="stat-card"><div class="num">220</div><div class="cap">Total respondents, convenience sample</div></div>
        <div class="stat-card"><div class="num">5</div><div class="cap">Demographic dimensions analysed: age, gender, education, occupation, area</div></div>
        <div class="stat-card"><div class="num">5-pt</div><div class="cap">Likert scale, Strongly Agree → Strongly Disagree</div></div>
        <div class="stat-card"><div class="num">25</div><div class="cap">Cross-tabulated distribution charts generated from responses</div></div>
      </div>
      <div class="note-box">Segments analysed include age bands (18–24 through 55–64), gender, education level (secondary through postgraduate), occupation (students, marketing professionals, freelancers, corporate employees, retirees), and area of residence (urban, suburban, rural, metropolitan, coastal).</div>
    </div>`
});

/* ---------- 8. Key Findings ---------- */
slides.push({
  key:'findings',
  render:()=>`
    <div class="slide-inner">
      <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit 07 — Key Findings</span></div>
      <h2 class="title">Headline Results</h2>
      <div class="stat-grid" style="margin-top:22px;">
        <div class="stat-card"><div class="num">68%</div><div class="cap">of respondents show moderate-to-high awareness of influencer liability issues</div></div>
        <div class="stat-card"><div class="num">54%</div><div class="cap">support enhanced technological interventions (detection, flagging tools)</div></div>
        <div class="stat-card"><div class="num">42%</div><div class="cap">identify gaps in government outreach and enforcement mechanisms</div></div>
        <div class="stat-card"><div class="num">74%</div><div class="cap">of urban respondents want stricter regulatory penalties</div></div>
      </div>
      <div class="note-box">Educational qualification emerged as the strongest descriptive predictor of awareness. Notably, when tested formally with chi-square and ANOVA at the 5% significance level, none of the five demographic associations (age, gender, education, occupation, area) reached statistical significance (all p &gt; 0.05) — the observed differences are directional, not statistically confirmed.</div>
    </div>`
});

/* ---------- Chart slide generator ---------- */
function chartSlide({exhibitNo, tag, title, chartId, chartType, labels, data, colors, resultBullets, discussion}){
  return {
    key:'chart-'+chartId, chartId, chartType, labels, data, colors,
    render:()=>`
      <div class="slide-inner">
        <div class="eyebrow"><span class="tick"></span><span class="mono">Exhibit ${exhibitNo} — ${tag}</span></div>
        <h2 class="title" style="max-width:22ch; margin-bottom:6px;">${title}</h2>
        <div class="chart-layout" style="margin-top:14px;">
          <div class="chart-frame"><canvas id="${chartId}"></canvas></div>
          <div class="chart-text scroll-area">
            <div class="col-label">Result</div>
            <ul class="points">${resultBullets.map(b=>`<li>${b}</li>`).join('')}</ul>
            <div class="col-label">Discussion</div>
            <ul class="points">${discussion.map(b=>`<li>${b}</li>`).join('')}</ul>
          </div>
        </div>
      </div>`
  };
}

const deckEl = document.getElementById('deck');
const railEl = document.getElementById('rail');
let current = 0;
let charts = {};

slides.forEach((s, i)=>{
  const el = document.createElement('div');
  el.className = 'slide' + (s.dark ? ' dark' : '');
  el.dataset.index = i;
  el.innerHTML = s.render();
  deckEl.appendChild(el);
  s.el = el;

  const tab = document.createElement('div');
  tab.className = 'rail-tab';
  tab.tabIndex = 0;
  tab.setAttribute('role','button');
  tab.setAttribute('aria-label', 'Go to slide ' + (i+1));
  tab.addEventListener('click', ()=>goTo(i));
  tab.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goTo(i);} });
  railEl.appendChild(tab);
  s.tab = tab;
});

document.getElementById('totalNum').textContent = slides.length;

function buildChart(s){
  if(!s.chartId || charts[s.chartId]) return;
  const ctx = document.getElementById(s.chartId);
  if(!ctx) return;
  chartDefaults();
  const isPie = s.chartType === 'pie' || s.chartType === 'doughnut';
  const cfg = {
    type: s.chartType,
    data:{
      labels: s.labels,
      datasets:[{
        data: s.data,
        backgroundColor: s.colors,
        borderWidth: isPie ? 2 : 0,
        borderColor: '#F5F6F3',
        borderRadius: isPie ? 0 : 3,
        barThickness: s.horizontal ? 26 : undefined,
      }]
    },
    options:{
      indexAxis: s.horizontal ? 'y' : 'x',
      responsive:true,
      maintainAspectRatio:false,
      animation:{ duration: 700, easing:'easeOutQuart' },
      plugins:{
        legend:{ display: isPie, position:'bottom', labels:{ boxWidth:10, boxHeight:10, padding:14, font:{size:11} } },
        tooltip:{
          backgroundColor:'#12213A', titleFont:{size:12}, bodyFont:{size:12}, padding:10, cornerRadius:2,
          callbacks:{ label: (ctx)=> `${ctx.label}: ${ctx.parsed.y ?? ctx.parsed}%` }
        },
        datalabels:false
      },
      scales: isPie ? {} : {
        x:{ display:!s.horizontal, grid:{ display:false }, ticks:{ font:{size:11} }, max: s.horizontal?100:undefined },
        y:{ display:true, grid:{ color:'rgba(18,33,58,0.08)' }, ticks:{ font:{size:11}, callback:(v)=> s.horizontal ? v : v+'%' }, max: s.horizontal?undefined:80 }
      }
    }
  };
  if(s.horizontal){
    cfg.options.scales.x = { grid:{ color:'rgba(18,33,58,0.08)' }, ticks:{ font:{size:11}, callback:(v)=>v+'%' }, max:80 };
    cfg.options.scales.y = { grid:{ display:false }, ticks:{ font:{size:12} } };
  }
  charts[s.chartId] = new Chart(ctx, cfg);
}

function goTo(i){
  if(i < 0 || i >= slides.length || i === current) { updateUI(); return; }
  slides[current].el.classList.remove('active');
  slides[current].el.classList.add(i < current ? 'prev' : '');
  current = i;
  const s = slides[current];
  s.el.classList.remove('prev');
  s.el.classList.add('active');
  updateUI();
  setTimeout(()=> buildChart(s), 60);
}

function updateUI(){
  document.getElementById('curNum').textContent = current + 1;
  document.getElementById('progressFill').style.width = ((current+1)/slides.length*100) + '%';
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === slides.length - 1;
  slides.forEach((s,i)=> s.tab.classList.toggle('on', i===current));
}

/* init */
slides[0].el.classList.add('active');
updateUI();

document.getElementById('prevBtn').addEventListener('click', ()=> goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=> goTo(current+1));

window.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ goTo(current+1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ goTo(current-1); }
  else if(e.key === 'Home'){ goTo(0); }
  else if(e.key === 'End'){ goTo(slides.length-1); }
});

/* touch / swipe */
let touchStartX = null;
document.getElementById('app').addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
document.getElementById('app').addEventListener('touchend', (e)=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx < 0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
}, {passive:true});

/* fullscreen */
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
  else{ document.exitFullscreen?.(); }
});

/* pptx download */
document.getElementById('pptxBtn').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = 'influencer-liability-tort-analysis.pptx';
  a.download = 'Influencer-Liability-Tort-Analysis.pptx';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
